<!DOCTYPE html>
<html>
<head>
<title> CSS types </title>
<link rel="stylesheet" href="external.css" >
</head>
<body> 
<!--this is inline CSS-->
<p title="this is inline css" style="color:green"> hello world</p>

<!--this is internal css using tag-->
<h2 id="id"> this is h3 </h2>

<!--this is internal css using class-->
<h2 class="myclass">this is h3</h2>


<input 
    class="numbers"
    placeholder="phone no."
    type="tel" 
    min="9" 
    max="10" 
    title="enter your number"
    required 
    autocomplete
    patter="[0-9]{10}"
/>
</body>
</html>
