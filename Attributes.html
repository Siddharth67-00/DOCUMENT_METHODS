<!DOCTYPE html>
<html lang="en">

<head>
<title>HTML Attributes</title>
</head>

<body>

<h1 id="heading" class="title" style="color:blue;"  title="My Heading" dir="ltr"  tabindex="1"  contenteditable="true"> HTML Attributes </h1>

<br>

<h2>Anchor Tag</h2>
<a href="https://www.google.com" target="_blank"  title="Open Google"  rel="noopener" download> Go to Google </a>

<br><br>

<h2>Image Tag</h2>
<img src="https://picsum.photos/300" alt="Random Image" width="300"  height="200" title="Sample Image" >

<br><br>

<h2>Form</h2>
<form action="#" method="post" autocomplete="on">

Name:
<input type="text" name="name" placeholder="Enter your name" minlength="2" maxlength="20" required autofocus>

<br><br>

Email:
<input type="email" placeholder="Enter email">

<br><br>

Password:
<input type="password" minlength="9">

<br><br>

Age:
<input type="number" min="18" max="60">

<br><br>

Phone:
<input type="tel" pattern="[0-9]{10}">

<br><br>

Gender:
<input type="radio" name="gender" checked> Male
<input type="radio" name="gender"> Female

<br><br>

Skills:
<input type="checkbox" checked> HTML
<input type="checkbox"> CSS

<br><br>

Favourite Color:
<input type="color">

<br><br>

Upload File:
<input type="file" accept= "image/*">

<br><br>

Website:
<input type="url">

</form>
</body>
</html>
